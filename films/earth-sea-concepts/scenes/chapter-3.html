<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Jua'; src: url('assets/fonts/Jua-Regular.ttf') format('truetype'); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbf6e6; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Jua', sans-serif; color: #173f4b; background: #fbf6e6; }
      #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #lines { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
      .tagwrap { position: absolute; width: max-content; transform: translate(-50%, -50%); z-index: 6; }
      .tag { opacity: 0; background: #fffdf5; border: 4px solid #173f4b; border-radius: 18px; padding: 8px 24px 10px; line-height: 1.15; white-space: nowrap; text-align: center; box-shadow: 0 10px 18px rgba(23,63,75,.2); }
      .tag small { display: block; font-size: 30px; color: #3c6670; margin-top: 2px; }
      #moa-wrap { position: absolute; left: 1572px; top: 712px; width: 300px; height: 315px; z-index: 8; }
      #moa { width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 100%; opacity: 0; }
      #ask-wrap { position: absolute; left: 1330px; top: 250px; width: 540px; z-index: 9; }
      #ask { opacity: 0; background: #fffdf5; border: 4px solid #173f4b; border-radius: 30px; padding: 26px 34px 30px; font-size: 52px; line-height: 1.22; box-shadow: 0 10px 18px rgba(23,63,75,.2); transform-origin: 80% 100%; position: relative; }
      #ask:after { content: ''; position: absolute; right: 92px; bottom: -34px; width: 44px; height: 44px; background: #fffdf5; border-right: 4px solid #173f4b; border-bottom: 4px solid #173f4b; transform: rotate(45deg) skew(8deg, 8deg); }
      #ask .w { display: inline-block; opacity: 0; }
      .endwrap { position: absolute; left: 760px; top: 108px; width: max-content; transform: translate(-50%, 0); z-index: 9; }
      .end { opacity: 0; background: #fbf6e6; border: 4px solid #173f4b; border-radius: 28px; padding: 18px 40px 22px; font-size: 68px; line-height: 1.15; white-space: nowrap; text-align: center; box-shadow: 0 12px 22px rgba(23,63,75,.22); }
      .end em { font-style: normal; color: #b26a00; }
      .end small { display: block; font-size: 38px; color: #3c6670; margin-top: 6px; }
      #finder{position:absolute;left:-260px;top:-210px;width:520px;height:420px;opacity:0;z-index:5} #finder i{position:absolute;width:90px;height:90px;border:0 solid #fffdf5}
        #finder i:nth-child(1){left:0;top:0;border-left-width:10px;border-top-width:10px} #finder i:nth-child(2){right:0;top:0;border-right-width:10px;border-top-width:10px}
        #finder i:nth-child(3){left:0;bottom:0;border-left-width:10px;border-bottom-width:10px} #finder i:nth-child(4){right:0;bottom:0;border-right-width:10px;border-bottom-width:10px}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div id="cam">
        <img id="bg" src="assets/img/coast.webp" alt="" />
        
      </div>
      <div id="finder"><i></i><i></i><i></i><i></i></div>
      <svg id="lines" viewBox="0 0 1920 1080"><line id="ln-t-sand" x1="1005" y1="550" x2="1005" y2="750" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200"/><circle id="dot-t-sand" cx="1005" cy="750" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-t-cliff" x1="1169" y1="689" x2="1169" y2="459" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="230" stroke-dashoffset="230"/><circle id="dot-t-cliff" cx="1169" cy="459" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-t-cave" x1="1594" y1="290" x2="1594" y2="540" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="250"/><circle id="dot-t-cave" cx="1594" cy="540" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-t-arch" x1="900" y1="790" x2="900" y2="540" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="250"/><circle id="dot-t-arch" cx="900" cy="540" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-w-sand" x1="1152" y1="846" x2="1382" y2="886" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="233" stroke-dashoffset="233"/><circle id="dot-w-sand" cx="1382" cy="886" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-w-cliff" x1="1458" y1="420" x2="1478" y2="270" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151"/><circle id="dot-w-cliff" cx="1478" cy="270" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-w-cave" x1="1698" y1="580" x2="1728" y2="410" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="173" stroke-dashoffset="173"/><circle id="dot-w-cave" cx="1728" cy="410" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/><line id="ln-w-arch" x1="931" y1="570" x2="931" y2="400" stroke="#173f4b" stroke-width="5" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="170"/><circle id="dot-w-arch" cx="931" cy="400" r="9" fill="#fffdf5" stroke="#173f4b" stroke-width="5" opacity="0"/></svg>
      <div class="tagwrap" id="t-sand" style="left:1005px;top:550px"><div class="tag" style="font-size:44px">모래사장</div></div>
      <div class="tagwrap" id="t-cliff" style="left:1169px;top:689px"><div class="tag" style="font-size:44px">절벽</div></div>
      <div class="tagwrap" id="t-cave" style="left:1594px;top:290px"><div class="tag" style="font-size:44px">동굴</div></div>
      <div class="tagwrap" id="t-arch" style="left:900px;top:790px"><div class="tag" style="font-size:44px">구멍 난 바위</div></div>
      <div class="tagwrap" id="w-sand" style="left:1152px;top:846px"><div class="tag" style="font-size:36px">모래사장</div></div>
      <div class="tagwrap" id="w-cliff" style="left:1458px;top:420px"><div class="tag" style="font-size:36px">절벽</div></div>
      <div class="tagwrap" id="w-cave" style="left:1698px;top:580px"><div class="tag" style="font-size:36px">동굴</div></div>
      <div class="tagwrap" id="w-arch" style="left:931px;top:570px"><div class="tag" style="font-size:36px">구멍 난 바위</div></div>
      <div id="ask-wrap"><div id="ask"><span class="w">해안에는</span> <span class="w">어떤</span> <span class="w">모습의</span> <span class="w">땅이</span> <span class="w">있을까?</span></div></div>
      <div class="endwrap"><div id="end" class="end">해안에는 여러 모습의 <em>지형</em>이 있어</div></div>
      <div id="moa-wrap"><img id="moa" src="assets/img/moa.webp" alt="" /></div>
      <audio id="sfx-0" class="clip" data-start="3.97" data-duration="0.53" data-track-index="10" data-volume="0.7" src="assets/sfx/camera.mp3"></audio>
      <audio id="sfx-1" class="clip" data-start="6.07" data-duration="0.53" data-track-index="11" data-volume="0.7" src="assets/sfx/camera.mp3"></audio>
      <audio id="sfx-2" class="clip" data-start="8.47" data-duration="0.53" data-track-index="12" data-volume="0.7" src="assets/sfx/camera.mp3"></audio>
      <audio id="sfx-3" class="clip" data-start="9.97" data-duration="0.53" data-track-index="13" data-volume="0.7" src="assets/sfx/camera.mp3"></audio>
      <audio id="sfx-4" class="clip" data-start="11.67" data-duration="0.58" data-track-index="14" data-volume="0.8" src="assets/sfx/success.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const pop = (id, t) => {
        const ln = document.getElementById('ln-' + id);
        if (ln) { tl.fromTo(ln, { attr: { 'stroke-dashoffset': ln.getAttribute('stroke-dasharray') } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.22, ease: 'power2.out' }, t); tl.fromTo('#dot-' + id, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t + 0.18); }
        tl.fromTo('#' + id + ' .tag', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.32, ease: 'back.out(2)' }, t + (ln ? 0.14 : 0));
      };
      const hide = (id, t) => {
        tl.to('#' + id + ' .tag', { opacity: 0, scale: 0.92, duration: 0.18, ease: 'power3.in' }, t);
        if (document.getElementById('ln-' + id)) tl.to(['#ln-' + id, '#dot-' + id], { opacity: 0, duration: 0.18 }, t);
      };
      // 모아: 오른쪽에서 들어와 찌그러졌다 섬(0.3–1.1 s).
      tl.fromTo('#moa', { opacity: 0, x: 380, rotation: 6 }, { opacity: 1, x: 0, rotation: 0, duration: 0.7, ease: 'expo.out' }, 0.25);
      tl.fromTo('#moa', { scaleY: 1, scaleX: 1 }, { scaleY: 0.9, scaleX: 1.06, duration: 0.12, ease: 'power2.out' }, 0.8);
      tl.to('#moa', { scaleY: 1, scaleX: 1, duration: 0.3, ease: 'back.out(2.2)' }, 0.92);
      // 질문 말풍선: 낱말씩 또렷해짐, 3.25 s에 빠짐.
      tl.fromTo('#ask', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.8)' }, 0.95);
      tl.fromTo('#ask .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.14, stagger: 0.09, ease: 'power2.out' }, 1.1);
      tl.to('#ask', { opacity: 0, scale: 0.9, duration: 0.22, ease: 'power3.in' }, 3.25);
      
      tl.to('#cam', { x: -1344, y: -756, scale: 1.7, duration: 0.55, ease: 'power2.inOut' }, 3.5); tl.set('#finder', { x: 1005, y: 750 }, 3.9); tl.fromTo('#finder', { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 3.95); tl.to('#finder', { opacity: 0, duration: 0.2 }, 4.45); pop('t-sand', 4.0); hide('t-sand', 5.45);
      tl.to('#cam', { x: -1344, y: 0, scale: 1.7, duration: 0.55, ease: 'power2.inOut' }, 5.6); tl.set('#finder', { x: 1169, y: 459 }, 6); tl.fromTo('#finder', { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 6.05); tl.to('#finder', { opacity: 0, duration: 0.2 }, 6.55); pop('t-cliff', 6.1); hide('t-cliff', 7.85);
      tl.to('#cam', { x: -1344, y: -157, scale: 1.7, duration: 0.55, ease: 'power2.inOut' }, 8); tl.set('#finder', { x: 1594, y: 540 }, 8.4); tl.fromTo('#finder', { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 8.45); tl.to('#finder', { opacity: 0, duration: 0.2 }, 8.95); pop('t-cave', 8.5); hide('t-cave', 9.4);
      tl.to('#cam', { x: -683, y: -140, scale: 1.7, duration: 0.55, ease: 'power2.inOut' }, 9.5); tl.set('#finder', { x: 900, y: 540 }, 9.9); tl.fromTo('#finder', { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'power2.out' }, 9.95); tl.to('#finder', { opacity: 0, duration: 0.2 }, 10.45); pop('t-arch', 10.0); hide('t-arch', 11.35);
      tl.to('#cam', { x: 0, y: 0, scale: 1, duration: 0.8, ease: 'power2.inOut' }, 11.45);
      pop('w-sand', 12.3); pop('w-cliff', 12.42); pop('w-cave', 12.54); pop('w-arch', 12.66);
      // 결론 한 줄과 모아의 반응(뛰어올랐다 내려앉기, 고개 끄덕).
      tl.fromTo('#end', { opacity: 0, y: -24, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.4, ease: 'expo.out' }, 11.65);
      tl.to('#moa', { scaleY: 0.88, scaleX: 1.08, duration: 0.12, ease: 'power2.in' }, 12.0);
      tl.to('#moa', { y: -70, scaleY: 1.06, scaleX: 0.96, duration: 0.26, ease: 'power2.out' }, 12.12);
      tl.to('#moa', { y: 0, scaleY: 1, scaleX: 1, duration: 0.3, ease: 'power2.in' }, 12.38);
      tl.to('#moa', { scaleY: 0.93, scaleX: 1.04, duration: 0.08 }, 12.68);
      tl.to('#moa', { scaleY: 1, scaleX: 1, rotation: -5, duration: 0.3, ease: 'back.out(2)' }, 12.76);
      tl.to('#moa', { rotation: 0, duration: 0.5, ease: 'power2.inOut' }, 13.6);
      tl.set({}, {}, 15);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
